<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продажа мерча</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Продажа мерча</h1>
    </header>

    <main class="merch-container">
        <!-- Карточка товара 1 -->
        <div class="merch-card">
            <img src="img/price/hoodie.jpg" alt="Худи Костя и Егорик">
            <h3>Худи "Костя и Егорик"</h3>
            <p class="description">Качественный плотный хлопок, оверсайз крой.</p>
            <p class="price">3 500 ₽</p>
        </div>

        <!-- Карточка товара 2 -->
        <div class="merch-card">
            <img src="img/price/tshirt.jpg" alt="Футболка Creator">
            <h3>Футболка "Creator"</h3>
            <p class="description">Стильный минималистичный дизайн, 100% хлопок.</p>
            <p class="price">1 800 ₽</p>
        </div>

        <!-- Карточка товара 3 -->
        <div class="merch-card">
            <img src="img/price/cap.jpg" alt="Кепка Егорик">
            <h3>Кепка "Егорик"</h3>
            <p class="description">Регулируемый размер, фирменная вышивка.</p>
            <p class="price">1 200 ₽</p>
        </div>
    </main>
</body>
</html>
